services:
  postgres:
    image: postgres:16
    container_name: cryptoflow-postgres
    environment:
      POSTGRES_DB: cryptoflow
      POSTGRES_USER: cryptoflow
      POSTGRES_PASSWORD: cryptoflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
