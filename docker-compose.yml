services:
  postgres:
    image: postgres:16
    container_name: cryptoflow-postgres
    environment:
      POSTGRES_DB: cryptoflow
      POSTGRES_USER: cryptoflow
      POSTGRES_PASSWORD: cryptoflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoflow -d cryptoflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.1
    container_name: cryptoflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  spark:
    build:
      context: ./spark
    container_name: cryptoflow-spark
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7,org.postgresql:postgresql:42.7.5
      - /opt/cryptoflow/app/streaming.py
    restart: on-failure

  airflow:
    image: apache/airflow:2.10.5
    container_name: cryptoflow-airflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: cryptoflow-local-development-key
      PYTHONPATH: /opt/airflow/project/ml
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: cryptoflow
      DB_USER: cryptoflow
      DB_PASSWORD: cryptoflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary pandas scikit-learn &&
      airflow db migrate &&
      (airflow users create --username admin --password admin
      --firstname Crypto --lastname Flow --role Admin
      --email admin@example.com || true) &&
      (airflow scheduler &) &&
      exec airflow webserver"
    restart: unless-stopped

volumes:
  postgres_data:
